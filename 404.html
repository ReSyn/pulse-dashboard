<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101d2b">
  <meta name="description" content="That PULSE page could not be found. Return to your dashboard.">
  <link rel="icon" href="icons/pulse.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Page not found | PULSE</title>
  <style>
    .not-found{min-height:75vh;display:grid;place-items:center;text-align:center}
    .not-found-card{max-width:520px;padding:42px 24px}
    .not-found-code{font:800 clamp(64px,15vw,110px)/1 Manrope,sans-serif;color:#23976b;letter-spacing:-6px;margin:0}
    .not-found h1{font:700 27px Manrope;margin:12px 0}
    .not-found p{color:#718092;margin:0 0 22px}
    .not-found .button{display:inline-block;text-decoration:none}
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="PULSE home"><span class="brand-mark" aria-hidden="true"></span><span><strong>PULSE</strong></span></a>
    </header>
    <main class="not-found">
      <section class="not-found-card">
        <p class="not-found-code">404</p>
        <h1>This page isn't here.</h1>
        <p>The link may be outdated, or the page may have moved.</p>
        <a class="button button-primary" href="./">Back to PULSE</a>
      </section>
    </main>
  </div>
</body>
</html>
